<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera VentaniYA - Soluciones 1001</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --panel-bg: #161b33;
      --neon-cyan: #00f3ff;
      --neon-orange: #ff9900;
      --card-bg: #1c2340;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-section {
      flex: 1 1 500px;
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .editor-section {
      flex: 1 1 500px;
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f1322;
      color: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--neon-cyan);
      outline: none;
      box-shadow: 0 0 5px var(--neon-cyan);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .grid-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      padding: 6px;
    }

    .grid-card:hover, .grid-card.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .grid-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
    }

    .grid-card p {
      margin: 5px 0 0 0;
      font-size: 0.75rem;
      color: #a0aec0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-group {
      width: 100%;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: #a0aec0;
      font-weight: bold;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #000;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-freeze {
      background: var(--neon-orange);
      color: #000;
    }

    .btn-freeze.active {
      background: var(--neon-cyan);
    }

    .btn-download {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <h1>VentaniYA Soluciones 1001 — Vidriera de Ventas</h1>

  <div class="main-layout">
    <!-- VIDRIERA PÚBLICA DE PRODUCTOS -->
    <div class="gallery-section">
      <h3>🏛️ Vidriera Pública (Fotos en Servidor)</h3>
      
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar estampilla o producto...">
      </div>

      <div class="grid-container" id="imageGrid">
        <p style="color:#a0aec0;">Cargando imágenes públicas de la vidriera...</p>
      </div>
    </div>

    <!-- EDITOR Y VISTA PREVIA -->
    <div class="editor-section">
      <h3>🖼️ Cartel Publicitario Seleccionado</h3>

      <canvas id="mainCanvas" width="1000" height="750"></canvas>

      <div class="form-group">
        <label for="addressInput">📍 Dirección Comercial:</label>
        <input type="text" id="addressInput" value="Av. Principal 1234, Local 5">
      </div>

      <div class="form-group">
        <label for="phoneInput">📞 Teléfono / WhatsApp:</label>
        <input type="text" id="phoneInput" value="+54 9 11 5555-4321">
      </div>

      <div class="form-group">
        <label for="emailInput">✉️ Contacto / Correo:</label>
        <input type="text" id="emailInput" value="contacto@ventaniya.com">
      </div>

      <div class="form-group">
        <label for="logoInput">Logo para el Cartel:</label>
        <input type="file" id="logoInput" accept="image/*">
      </div>

      <button class="btn btn-freeze" id="freezeBtn">❄️ Congelar Hora / Reloj</button>
      <button class="btn btn-download" id="downloadBtn">📥 Descargar Publicidad Fija (PNG)</button>
    </div>
  </div>

  <script>
    // CONFIGURACIÓN VINCULADA A TU NUEVO REPOSITO PÚBLICO
    const GITHUB_USER = 'ofispaciospaseo-del';
    const GITHUB_REPO = 'estantesjet';
    const FOLDER_PATH = 'assets/images';

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imageGrid = document.getElementById('imageGrid');
    const searchInput = document.getElementById('searchInput');

    const addressInput = document.getElementById('addressInput');
    const phoneInput = document.getElementById('phoneInput');
    const emailInput = document.getElementById('emailInput');
    const logoInput = document.getElementById('logoInput');

    const freezeBtn = document.getElementById('freezeBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let allImages = [];
    let baseImage = new Image();
    let uploadedLogo = null;
    let currentHash = generateHash();
    let isFrozen = false;
    let frozenDate = null;

    baseImage.crossOrigin = "anonymous";

    // 1. CARGA DE TEXTOS GUARDADOS LOCALMENTE
    function loadSavedTexts() {
      if (localStorage.getItem('v_address')) addressInput.value = localStorage.getItem('v_address');
      if (localStorage.getItem('v_phone')) phoneInput.value = localStorage.getItem('v_phone');
      if (localStorage.getItem('v_email')) emailInput.value = localStorage.getItem('v_email');

      const savedLogo = localStorage.getItem('v_logo');
      if (savedLogo) {
        uploadedLogo = new Image();
        uploadedLogo.src = savedLogo;
      }
    }

    function saveTexts() {
      localStorage.setItem('v_address', addressInput.value);
      localStorage.setItem('v_phone', phoneInput.value);
      localStorage.setItem('v_email', emailInput.value);
    }

    [addressInput, phoneInput, emailInput].forEach(inp => inp.addEventListener('input', saveTexts));

    // 2. OBTENER TODAS LAS IMÁGENES PÚBLICAS DE GITHUB
    async function loadGitHubImages() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`);
        if (!res.ok) throw new Error('Aún no hay imágenes en la carpeta pública.');
        const files = await res.json();
        
        allImages = files
          .filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))
          .map((f, i) => ({
            id: `gh-${i}`,
            name: f.name,
            url: f.download_url
          }));

        renderGrid();
      } catch (e) {
        imageGrid.innerHTML = '<p style="color:#a0aec0;">Agrega tus 100+ imágenes en la carpeta <code>assets/images</code> en GitHub para verlas aquí públicamente desde cualquier dispositivo.</p>';
      }
    }

    // 3. MOSTRAR LA GRILLA PÚBLICA
    function renderGrid() {
      const query = searchInput.value.toLowerCase();
      const filtered = allImages.filter(img => img.name.toLowerCase().includes(query));

      if (filtered.length === 0) {
        imageGrid.innerHTML = '<p style="color:#a0aec0;">No se encontraron imágenes en el servidor público.</p>';
        return;
      }

      imageGrid.innerHTML = '';
      filtered.forEach((imgObj, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `
          <img src="${imgObj.url}" alt="${imgObj.name}">
          <p>${imgObj.name}</p>
        `;
        card.addEventListener('click', () => {
          document.querySelectorAll('.grid-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          baseImage.src = imgObj.url;
        });

        if (idx === 0 && !baseImage.src) {
          card.classList.add('active');
          baseImage.src = imgObj.url;
        }

        imageGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderGrid);

    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          uploadedLogo = new Image();
          uploadedLogo.src = ev.target.result;
          try { localStorage.setItem('v_logo', ev.target.result); } catch(err){}
        };
        reader.readAsDataURL(file);
      }
    });

    freezeBtn.addEventListener('click', () => {
      isFrozen = !isFrozen;
      if (isFrozen) {
        frozenDate = new Date();
        freezeBtn.textContent = '▶️ Descongelar Reloj';
        freezeBtn.classList.add('active');
      } else {
        freezeBtn.textContent = '❄️ Congelar Hora / Reloj';
        freezeBtn.classList.remove('active');
      }
    });

    function generateHash() {
      return 'ID-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
    }

    // 4. DIBUJO EN CANVAS
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (baseImage.complete && baseImage.naturalWidth !== 0) {
        ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const grad = ctx.createLinearGradient(0, canvas.height - 180, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, canvas.height - 180, canvas.width, 180);

      const now = isFrozen && frozenDate ? frozenDate : new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      const ms = String(now.getMilliseconds()).padStart(3, '0');

      ctx.font = '900 40px "Orbitron", monospace';
      ctx.fillStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 10;
      ctx.textAlign = 'left';
      ctx.fillText(`${hrs}:${mins}:${secs}.${ms}`, 30, canvas.height - 100);

      const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      ctx.font = '700 16px "Roboto", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5;
      ctx.fillText(dateStr, 30, canvas.height - 68);

      ctx.font = '13px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`HASH: ${currentHash}`, 30, canvas.height - 40);

      ctx.save();
      const stampX = canvas.width - 130;
      const stampY = canvas.height - 100;
      ctx.strokeStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(stampX, stampY, 60, 0, Math.PI * 2);
      ctx.stroke();

      ctx.font = '900 11px "Orbitron", sans-serif';
      ctx.fillStyle = '#00f3ff';
      ctx.textAlign = 'center';
      ctx.fillText("VentaniYA", stampX, stampY - 12);
      ctx.font = '700 9px "Roboto", sans-serif';
      ctx.fillText("SOLUCIONES", stampX, stampY + 5);
      ctx.font = '900 15px "Orbitron", sans-serif';
      ctx.fillText("1001", stampX, stampY + 24);
      ctx.restore();

      ctx.fillStyle = 'rgba(12, 15, 29, 0.85)';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1;
      ctx.fillRect(30, 25, canvas.width - 60, 95);
      ctx.strokeRect(30, 25, canvas.width - 60, 95);

      let textX = 45;
      if (uploadedLogo && uploadedLogo.complete) {
        ctx.drawImage(uploadedLogo, 40, 32, 80, 80);
        textX = 135;
      }

      ctx.textAlign = 'left';
      ctx.font = '700 17px "Roboto", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`📍 Dir: ${addressInput.value}`, textX, 52);
      ctx.fillText(`📞 Tel: ${phoneInput.value}`, textX, 80);
      ctx.fillText(`✉️ Mail: ${emailInput.value}`, textX, 104);
    }

    function renderLoop() {
      drawCanvas();
      requestAnimationFrame(renderLoop);
    }

    loadSavedTexts();
    loadGitHubImages();
    requestAnimationFrame(renderLoop);

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `Publicidad_VentaniYA_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
